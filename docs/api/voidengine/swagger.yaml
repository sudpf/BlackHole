basePath: 这里写base path
consumes:
- application/json
definitions:
  contract.AddUserRequest:
    properties:
      email:
        maxLength: 100
        minLength: 5
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
      phone:
        maxLength: 20
        minLength: 4
        type: string
      rePassword:
        maxLength: 20
        minLength: 8
        type: string
      username:
        maxLength: 32
        type: string
    required:
    - password
    - rePassword
    - username
    type: object
  contract.DeleteUserRequest:
    properties:
      username:
        maxLength: 32
        type: string
    required:
    - username
    type: object
  contract.ListNetworkTrafficResponse:
    properties:
      bytesIn:
        type: integer
      bytesOut:
        type: integer
      description:
        type: string
      destinationIp:
        type: string
      destinationPort:
        type: integer
      packetCount:
        type: integer
      protocol:
        type: string
      sourceIp:
        type: string
      sourcePort:
        type: integer
      timestamp:
        type: string
    type: object
  contract.ListUserResponse:
    properties:
      email:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  contract.ModifyUserRequest:
    properties:
      email:
        maxLength: 100
        minLength: 5
        type: string
      password:
        maxLength: 20
        minLength: 8
        type: string
      phone:
        maxLength: 20
        minLength: 4
        type: string
      rePassword:
        maxLength: 20
        minLength: 8
        type: string
      username:
        maxLength: 32
        type: string
    required:
    - username
    type: object
  response.ApiResponse:
    properties:
      code:
        type: integer
      data: {}
      details: {}
      message:
        type: string
    type: object
