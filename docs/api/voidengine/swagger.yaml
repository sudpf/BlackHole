paths:
  /ping:
    get:
      consumes:
      - application/json
      description: Ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - ping
    post:
      consumes:
      - application/json
      description: Ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - ping
  /v1/traffic:
    get:
      consumes:
      - application/json
      description: List NetworkTraffics
      parameters:
      - default: zh
        description: Language
        in: header
        name: Accept-Language
        type: string
      - example: desc
        in: query
        maxLength: 4
        name: orderBy
        type: string
      - example: 1
        in: query
        minimum: 1
        name: pageNo
        type: integer
      - example: 50
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/contract.ListNetworkTrafficResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - NetworkTraffic
  /v1/user:
    delete:
      consumes:
      - application/json
      description: Delete a User
      parameters:
      - default: zh
        description: Language
        in: header
        name: Accept-Language
        type: string
      - description: delete user param
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/contract.DeleteUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - User
    get:
      consumes:
      - application/json
      description: List Users
      parameters:
      - default: zh
        description: Language
        in: header
        name: Accept-Language
        type: string
      - default: 1
        description: 当前页码
        in: query
        name: pageNo
        type: integer
      - default: 50
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - default: desc
        description: 排序方式[desc, asc]
        in: query
        name: orderBy
        type: string
      - description: 用户名
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/contract.ListUserResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Add a User
      parameters:
      - default: zh
        description: Language
        in: header
        name: Accept-Language
        type: string
      - description: add user param
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/contract.AddUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - User
    put:
      consumes:
      - application/json
      description: Modify a User
      parameters:
      - default: zh
        description: Language
        in: header
        name: Accept-Language
        type: string
      - description: modify user param
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/contract.ModifyUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ApiResponse'
      tags:
      - User
produces:
- application/json
