app:
  listen_http: 127.0.0.1:8002
  listen_https: 127.0.0.1:8003

log:
  level: info
  size: 256m
  dir: logs

clusters:
- input:
    syslogs:
    - protocol: Unixgram
      address: /tmp/suricata_unix_sock
      processors: 2
  filters:
  - action: drop
    conditions:
      - key: k8s_container_name
        value: "-rpc"
        type: contains
      - key: level
        value: info
        type: match
        op: and
  - action: remove_field
    fields:
      - message
      - _source
      - _type
      - _score
      - _id
      - "@version"
      - topic
      - index
      - beat
      - docker_container
      - offset
      - prospector
      - source
      - stream
  - action: transfer
    field: content
  output:
    clickhouse:
      addr:
      - 192.168.3.143:9000
      auth:
        database: voidengine
        username: default
        password: "123456"
      table: network_traffics
      columns:
      - timestamp
      - source_ip
      - destination_ip
      - source_port
      - destination_port
      - protocol
      - bytes_in
      - bytes_out
      - packet_count
      - description
      interval: 1
      max_chunk_bytes: 157286400
