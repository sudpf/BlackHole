app:
  listen: http://127.0.0.1:8002
  request_timeout: 30s
  shutdown_timeout: 10s

log:
  level: info
  size: 256m
  dir: logs

metrics:
  enabled: true
  listen: http://127.0.0.1:19102
  path: /metrics

clusters:
- input:
    syslogs:
    - protocol: Udp
      address: 127.0.0.1
      port: 1514
      processors: 2
  filters:
  - action: transfer
    field: content
  - action: transfer
    field: message
  output:
    clickhouse:
      addr:
      - 127.0.0.1:9001
      auth:
        database: voidengine
        username: default
        password: "123456"
      table: network_traffics
      columns:
      - timestamp
      - source_ip
      - destination_ip
      - source_port
      - destination_port
      - protocol
      - bytes_in
      - bytes_out
      - packet_count
      - description
      interval: 1
      max_chunk_bytes: 15728640
